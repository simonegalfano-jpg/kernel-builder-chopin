name: Build Kernel P30 Lite KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev ccache curl git gcc-aarch64-linux-gnu

      - name: Get Kernel Source
        run: |
          git clone --depth=1 --single-branch https://github.com/Ante0/RVL_9.1 kernel

      - name: Emergency Source Fix
        run: |
          cd kernel
          # Risolve yylloc eliminando la doppia dichiarazione alla radice
          sed -i '/YYLTYPE yylloc;/d' scripts/dtc/dtc-lexer.lex.c_shipped
          sed -i '/YYLTYPE yylloc;/d' scripts/dtc/dtc-parser.tab.c_shipped
          # Forza il Makefile a ignorare gli errori di local_clock
          sed -i 's/-Werror-/-Wno-error-/g' Makefile
          sed -i 's/-Werror/-Wno-error/g' Makefile

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/MAR-LX1A_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/MAR-LX1A_defconfig

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Flag di compatibilità estrema
          export KCFLAGS="-fcommon -Wno-error"
          export HOSTCFLAGS="-fcommon"
          
          make O=out MAR-LX1A_defconfig
          make O=out -j$(nproc) KCFLAGS="$KCFLAGS" HOSTCFLAGS="$HOSTCFLAGS"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_P30_Lite_KSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
