name: Build Kernel P30 Lite KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev ccache curl git

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-build-${{ github.sha }}
          restore-keys: kernel-build-

      - name: Get Source and Toolchain
        run: |
          git clone --depth=1 --single-branch https://github.com/Ante0/RVL_9.1 kernel
          # Link pubblico che NON chiede password
          git clone --depth=1 https://github.com/lineageos-mirror/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/MAR-LX1A_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/MAR-LX1A_defconfig

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          make O=out MAR-LX1A_defconfig
          make O=out -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_P30_Lite_KSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
