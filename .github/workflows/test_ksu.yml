name: Build Kernel P30 Lite KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev ccache curl git gcc-aarch64-linux-gnu

      - name: Get Kernel Source
        run: |
          git clone --depth=1 --single-branch https://github.com/Ante0/RVL_9.1 kernel

      - name: Hard Fix for yylloc and local_clock
        run: |
          cd kernel
          # Corregge l'errore yylloc eliminando la doppia definizione alla radice
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-parser.tab.c_shipped
          # Corregge l'errore local_clock visto nei log
          sed -i 's/return local_clock();/return 0;/g' kernel/sched/clock.c || true

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/MAR-LX1A_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/MAR-LX1A_defconfig

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Usiamo flag di compatibilità per forzare il successo della build
          export KCFLAGS="-fcommon -Wno-error"
          
          make O=out MAR-LX1A_defconfig
          make O=out -j$(nproc) KCFLAGS="$KCFLAGS"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_P30_Lite_KSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
