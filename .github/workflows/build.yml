name: Build Kernel P30 Lite
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curlie bison flex libssl-dev libelf-dev

      - name: Get Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/Ante0/RVL_9.1 kernel
          git clone --depth=1 https://github.com/npaudio/arm64-gcc-4.9 gcc

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-
          make MAR-LX1A_defconfig
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_P30_Lite
          path: kernel/arch/arm64/boot/Image.gz-dtb
